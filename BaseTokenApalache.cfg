SPECIFICATION Spec

CONSTANTS
    Addresses = {a1, a2, issuer, feeAddr}
    Currencies = {USD}
    MaxAmount = 1000
    Issuer = issuer
    FeeSetter = issuer
    FeeAddressSetter = issuer
    FeeAddress = feeAddr

INVARIANTS
    BalancesNonNegative
    EmissionNonNegative
    TotalBalanceEqualsEmission
    FeeRateValid
    LimitsValid
    RatesNonNegative

    \* Action invariants (state transitions)
    EmissionAuthorization
    BuyConsistency
    BuyBackConsistency
    TransferConsistency
